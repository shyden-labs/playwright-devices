<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Device journey</title>
    <style>
      body {
        font:
          18px system-ui,
          sans-serif;
        margin: 16px;
      }
      button,
      input,
      select {
        font: inherit;
        min-height: 48px;
        /* Nothing wider than the screen: an overflowing file input made Safari zoom the page to fit
           mid-journey, so a tap computed during the zoom missed (measured 2026-11-18). */
        box-sizing: border-box;
        max-width: 100%;
      }
      #spacer {
        height: 300vh;
      }
    </style>
  </head>
  <body>
    <h1>Device journey</h1>
    <button type="button" id="tap">Tap me</button>
    <p data-testid="tap-result"></p>
    <label>Name <input id="name" autocomplete="off" /></label>
    <p data-testid="typed-result"></p>
    <label
      >Colour
      <select id="colour">
        <option>Red</option>
        <option>Green</option>
        <option>Blue</option>
      </select></label
    >
    <p data-testid="select-result"></p>
    <label>File <input type="file" id="file" /></label>
    <p data-testid="file-result"></p>
    <label>Photo <input type="file" accept="image/*" id="photo" /></label>
    <p data-testid="photo-result"></p>
    <p data-testid="scroll-result"></p>
    <div id="spacer"></div>
    <script>
      const show = (id, text) => {
        document.querySelector(`[data-testid="${id}"]`).textContent = text;
      };
      document.getElementById('tap').addEventListener('click', (event) => {
        if (event.isTrusted) show('tap-result', 'Tapped');
      });
      document.getElementById('name').addEventListener('input', (event) => show('typed-result', event.target.value));
      document.getElementById('colour').addEventListener('change', (event) => show('select-result', event.target.value));
      document.getElementById('file').addEventListener('change', (event) => show('file-result', event.target.files[0]?.name ?? ''));
      // The photo's name and date are personal, so only its kind is shown.
      document
        .getElementById('photo')
        .addEventListener('change', (event) =>
          show('photo-result', event.target.files[0]?.type.startsWith('image/') ? 'an image' : 'not an image'),
        );
      addEventListener(
        'scroll',
        () => {
          if (scrollY > 0) show('scroll-result', 'Scrolled');
        },
        { passive: true },
      );
    </script>
  </body>
</html>
