# Shyden: Apple's default pf rules, plus one anchor keeping Safari's debug proxy
# (ios_webkit_debug_proxy, ports 9221-9322) reachable from this Mac only.
# shyden-labs/playwright-devices#19. Loaded at boot by uk.co.shyden.pf.plist.
scrub-anchor "com.apple/*"
nat-anchor "com.apple/*"
rdr-anchor "com.apple/*"
dummynet-anchor "com.apple/*"
anchor "com.apple/*"
load anchor "com.apple" from "/etc/pf.anchors/com.apple"
block drop in quick on ! lo0 proto tcp from any to any port 9221:9322
