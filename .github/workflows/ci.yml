# Every third-party `uses:` is a full 40-hex commit SHA with a trailing
# `# vX.Y.Z` comment. A tag is mutable and can be repointed by anyone who can
# push to that action's repo; the SHA is the only immutable reference. The
# comment is what makes a Dependabot bump reviewable by a human rather than an
# opaque hex swap -- so never remove it, and never let it drift from the SHA.
name: build-and-test
on:
  pull_request:
  push:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      # GitHub opens Dependabot SECURITY fixes against the default branch
      # only; `target-branch` in dependabot.yml steers version updates alone.
      # With any default but develop, every security fix lands outside the
      # develop gate. First step, so a wrong default fails in seconds (issue shyden-labs/repo-template#46).
      - name: The default branch is develop
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$DEFAULT_BRANCH" != "develop" ]; then
            echo "::error::The default branch is '$DEFAULT_BRANCH', not develop, so Dependabot security fixes open outside the develop gate. Set it in Settings > General > Default branch."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - run: node scripts/npm-ci.ts
      # Any known vulnerability, of any severity and dev dependencies included, fails the build (shyden-labs/repo-template#156),
      # except an advisory with a dated exception in scripts/audit.ts (shyden-labs/playwright-devices#22).
      - name: Audit
        run: node scripts/audit.ts
      # The static checks (issue shyden-labs/repo-template#61); .githooks/pre-push runs the same three before every push.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - run: npm run test:unit

  # The shared desktop-browser setup run as a project would import it (shyden-labs/playwright-devices#17):
  # the README's sample config on every desktop browser, then the one-suite checks over the run
  # (shyden-labs/playwright-devices#16), equal totals printed per browser.
  desktop-e2e:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - run: node scripts/npm-ci.ts
      # AC 5: a browser that cannot start fails the run, naming it and why. Firefox is pointed at an
      # empty browser folder, so its launch fails; the run must fail and say which browser and why.
      - name: A browser that cannot start fails the run, naming it
        run: |
          set +e
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/no-browsers" npx playwright test -c playwright.desktop.config.ts --project=firefox --reporter=list > "$RUNNER_TEMP/no-firefox.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/no-firefox.txt"
          test "$status" -ne 0
          grep -q "Executable doesn't exist at $RUNNER_TEMP/no-browsers/firefox" "$RUNNER_TEMP/no-firefox.txt"
          grep -q '\[firefox\]' "$RUNNER_TEMP/no-firefox.txt"
      - name: Install the desktop browsers
        run: npx playwright install --with-deps chromium chrome firefox webkit msedge
      - name: Run the sample config on every desktop browser
        run: npx playwright test -c playwright.desktop.config.ts
      - name: List the tests each desktop browser should run
        run: npx playwright test -c playwright.desktop.config.ts --list --reporter=json > test-results/desktop-list.json
      - name: One-suite checks over the desktop group
        run: >-
          node src/one-suite/cli.ts --group desktop=chromium,chrome,firefox,webkit,msedge
          --list test-results/desktop-list.json --report test-results/desktop-report.json
          --assertions test-results/desktop-assertions.json

  # Coverage runs apart from the 1 s unit step: one overall threshold over the
  # TypeScript under scripts/ (vitest.unit.config.ts, shyden-labs/repo-template#149).
  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - run: node scripts/npm-ci.ts
      - run: npm run test:coverage

  # The SonarCloud quality gate, blocking (shyden-labs/repo-template#27, shyden-labs/repo-template#60): the reusable workflow
  # scans, then fails unless this scan's gate is OK (docs/sonarcloud.md).
  sonarcloud:
    uses: ./.github/workflows/sonarcloud.yml
    with:
      organization: shyden-labs
      project-key: shyden-labs_playwright-devices
    secrets: inherit
