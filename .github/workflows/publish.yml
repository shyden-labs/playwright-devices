# Publishes @shyden-labs/playwright-devices to npmjs.com when a release is published
# (shyden-labs/playwright-devices#16; Shyden 2026-11-18: the registry, with trusted publishing).
# No npm token is stored: npm trusts this workflow file, in this repository and the `npm`
# environment, and GitHub Actions signs in through OIDC (id-token: write); npm attaches provenance
# itself (docs.npmjs.com/trusted-publishers: npm 11.5.1+, Node 22.14+). Shyden approves each publish
# as the `npm` environment's required reviewer.
# Two jobs, so no dependency code runs where the publish token can be asked for: `build` installs,
# builds and packs with no OIDC token; `publish` checks out only the Node pin and publishes the
# packed tarball, installing nothing.
# Every third-party `uses:` is a full 40-hex commit SHA with a trailing `# vX.Y.Z` comment.
name: publish
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: The release tag is v followed by the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(npm pkg get version | tr -d '"')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release tag is '$TAG' but the package version is '$version'; tag the release v$version."
            exit 1
          fi
      - run: node scripts/npm-ci.ts
      - run: npm run build
      # An installing project's npm counts a dependency's prepare as an install script and warns
      # until it is approved; prepare only sets this repo's git hooks, so the published manifest
      # leaves it out (measured 2026-11-18, research/package/install-2026-11-18.txt).
      - run: npm pkg delete scripts.prepare
      - run: npm pack --pack-destination package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docker/node/Dockerfile
          sparse-checkout-cone-mode: false
      # The exact Node, from the one file Dependabot bumps (shyden-labs/repo-template#143).
      - id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      - run: npm publish package/*.tgz --access public
